[project]
name = "stock-price-prediction"
version = "1.0.0"
description = "A modular LSTM-based stock price prediction system using TensorFlow and technical indicators."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Ayush Kumar" }
]

keywords = [
    "machine-learning",
    "deep-learning",
    "lstm",
    "stock-price-prediction",
    "tensorflow",
    "time-series",
    "finance"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.10",
    "scikit-learn>=1.7",
    "tensorflow>=2.20",
    "yfinance>=0.2",
    "PyYAML>=6.0",
    "rich>=14.0"
]